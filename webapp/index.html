<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel sterowania Pogoda World</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-top: rgb(70, 86, 138);
            --bg-bot: rgb(41, 57, 104);
            --card-bg: rgba(255, 255, 255, 0.12);
            --card-border: rgba(255, 255, 255, 0.18);
            
            --text-main: rgb(230, 235, 245);
            --text-muted: rgba(230, 235, 245, 0.7);
            
            --title-today: rgb(254, 240, 138);   /* Żółty */
            --title-future: rgb(138, 226, 160);  /* Zielony */
            --accent-purple: rgb(220, 180, 255); /* Lawendowy */
            --alert-red: rgb(252, 129, 129);     /* Czerwony alert */
            
            --input-bg: rgba(0, 0, 0, 0.25);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 30px 22px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
            text-align: center;
            margin-top: 10px;
        }

        h3 {
            margin: 0 0 16px 0;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        #ui-hours-title {
            color: var(--title-today);
            font-size: 15px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        hr {
            border: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            margin: 24px 0;
        }

        label {
            display: block;
            margin: 16px 0 6px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            color: var(--accent-purple);
        }

        select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: var(--input-bg);
            color: var(--text-main);
            font-size: 15px;
            font-weight: 500;
            outline: none;
            transition: border-color 0.2s;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--title-today);
        }

        option {
            background-color: rgb(41, 57, 104);
            color: rgb(230, 235, 245);
        }

        button {
            width: 100%;
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:active {
            transform: scale(0.98);
        }

        #gps-button {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.25);
            margin-bottom: 5px;
        }

        #gps-button:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: var(--accent-purple);
        }

        #save-settings-button {
            background-color: var(--title-future);
            color: rgb(20, 30, 55);
            margin-top: 25px;
            box-shadow: 0 4px 15px rgba(138, 226, 160, 0.25);
        }

        #save-settings-button:hover {
            background-color: rgb(155, 235, 175);
            box-shadow: 0 6px 20px rgba(138, 226, 160, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SEKCJA 1: LOKALIZACJA -->
        <h3 id="ui-title">Panel sterowania</h3>
        <button id="gps-button">📍 <span id="gps-text">Zaktualizuj przez GPS</span></button>

        <hr>

        <!-- SEKCJA 2: GODZINY RAPORTÓW -->
        <h3 id="ui-hours-title">Wybierz godziny raportów (domyślnie o 8:00 i 14:00)</h3>

        <label id="ui-morning">Raport poranny</label>
        <select id="rano">
            <option value="" id="opt-rano-none">(bez zmian)</option>
            <option value="05:00">05:00</option>
            <option value="06:00">06:00</option>
            <option value="07:00">07:00</option>
            <option value="08:00">08:00</option>
            <option value="09:00">09:00</option>
            <option value="10:00">10:00</option>
            <option value="11:00">11:00</option>
            <option value="brak" id="opt-rano-off">Nie chcę rano</option>
        </select>

        <label id="ui-evening">Aktualizacja popołudniowa</label>
        <select id="wieczor">
            <option value="" id="opt-wiecz-none">(bez zmian)</option>
            <option value="13:00">13:00</option>
            <option value="14:00">14:00</option>
            <option value="15:00">15:00</option>
            <option value="16:00">16:00</option>
            <option value="brak" id="opt-wiecz-off">Nie chcę popołudniu</option>
        </select>

        <button id="save-settings-button">💾 <span id="save-text">Zapisz ustawienia raportów</span></button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        let currentLang = (urlParams.get('lang') || 'en').toLowerCase();
        if (currentLang === "nb") currentLang = "no"; 

        const translations = {
            "pl": { 
                title: "Panel sterowania", 
                btnGps: "Zaktualizuj przez GPS", 
                hoursTitle: "Wybierz godziny raportów (domyślnie o 8:00 i 14:00)",
                morning: "Raport poranny", 
                evening: "Aktualizacja popołudniowa", 
                btnSave: "Zapisz ustawienia raportów",
                optNoChange: "(bez zmian)",
                optOffMorn: "Nie chcę rano",
                optOffEve: "Nie chcę popołudniu"
            },
            "en": { 
                title: "Control Panel", 
                btnGps: "Update via GPS", 
                hoursTitle: "Choose report hours (default at 8:00 and 14:00)",
                morning: "Morning report", 
                evening: "Afternoon update", 
                btnSave: "Save report settings",
                optNoChange: "(no change)",
                optOffMorn: "Turn off morning report",
                optOffEve: "Turn off afternoon update"
            },
            "de": { 
                title: "Bedienfeld", 
                btnGps: "Mit GPS aktualisieren", 
                hoursTitle: "Berichtszeiten wählen (Standard um 8:00 und 14:00)",
                morning: "Morgenbericht", 
                evening: "Nachmittags-Update", 
                btnSave: "Berichtseinstellungen speichern",
                optNoChange: "(keine Änderung)",
                optOffMorn: "Morgens deaktivieren",
                optOffEve: "Nachmittags deaktivieren"
            },
            "fr": { 
                title: "Panneau de configuration", 
                btnGps: "Mettre à jour via GPS", 
                hoursTitle: "Choisissez les heures (par défaut à 8:00 et 14:00)",
                morning: "Rapport matinal", 
                evening: "Mise à jour l'après-midi", 
                btnSave: "Enregistrer les paramètres",
                optNoChange: "(aucun changement)",
                optOffMorn: "Désactiver le matin",
                optOffEve: "Désactiver l'après-midi"
            },
            "es": { 
                title: "Panel de control", 
                btnGps: "Actualizar vía GPS", 
                hoursTitle: "Elige las horas de reporte (por defecto a las 8:00 y 14:00)",
                morning: "Reporte matutino", 
                evening: "Actualización de tarde", 
                btnSave: "Guardar ajustes de reporte",
                optNoChange: "(sin cambios)",
                optOffMorn: "Desactivar por la mañana",
                optOffEve: "Desactivar por la tarde"
            },
            "no": { 
                title: "Kontrollpanel", 
                btnGps: "Oppdater via GPS", 
                hoursTitle: "Velg rapporttider (standard kl. 8:00 og 14:00)",
                morning: "Morgenrapport", 
                evening: "Ettermiddagsoppdatering", 
                btnSave: "Lagre rapportinnstillinger",
                optNoChange: "(ingen endring)",
                optOffMorn: "Slå av morgenrapport",
                optOffEve: "Slå av ettermiddagsoppdatering"
            }
        };

        const t = translations[currentLang] || translations["en"];
        
        document.getElementById("ui-title").innerText = t.title;
        document.getElementById("gps-text").innerText = t.btnGps;
        document.getElementById("ui-hours-title").innerText = t.hoursTitle;
        document.getElementById("ui-morning").innerText = t.morning;
        document.getElementById("ui-evening").innerText = t.evening;
        document.getElementById("save-text").innerText = t.btnSave;

        document.getElementById("opt-rano-none").innerText = t.optNoChange;
        document.getElementById("opt-wiecz-none").innerText = t.optNoChange;
        document.getElementById("opt-rano-off").innerText = t.optOffMorn;
        document.getElementById("opt-wiecz-off").innerText = t.optOffEve;

        document.getElementById("gps-button").addEventListener("click", () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const payload = JSON.stringify({
                            type: "set_location",
                            lat: position.coords.latitude,
                            lon: position.coords.longitude
                        });
                        tg.sendData(payload);
                    },
                    (error) => { alert("Błąd GPS / GPS Error: " + error.message); }
                );
            } else {
                alert("Geolokalizacja nie jest wspierana. / Geolocation not supported.");
            }
        });

        document.getElementById("save-settings-button").addEventListener("click", () => {
            const payload = JSON.stringify({
                type: "set_settings",
                rano: document.getElementById("rano").value,
                wieczor: document.getElementById("wieczor").value
            });
            tg.sendData(payload);
        });
    </script>
</body>
</html>
