<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ustaw lokalizację - Pogoda World</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 10px;
        }
        p {
            font-size: 15px;
            opacity: 0.8;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            max-width: 300px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.8;
        }
        button:disabled {
            background-color: var(--tg-theme-hint-color, #999999);
            cursor: not-allowed;
        }
        .err {
            margin-top: 20px;
            color: #e53935;
            font-weight: 500;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="icon">📍</div>
    <h1>Dokładna lokalizacja</h1>
    <p>Udostępnij swój GPS, aby bot mógł wysyłać idealnie dopasowane prognozy pogody.</p>
    
    <button id="btn">Udostępnij lokalizację</button>
    <div id="err" class="err"></div>

    <script>
	
	// --- DEBUG ---
    const tg = window.Telegram?.WebApp;
    document.body.insertAdjacentHTML(
        "beforeend",
        `<pre id="dbg" style="font-size:10px; color:gray; position:fixed; bottom:0; width:100%; text-align:center;">
        TelegramWebApp: ${!!tg} | platform: ${tg?.platform || 'unknown'} | version: ${tg?.version || 'N/A'}
        </pre>`
    );
    // -------------

    if (tg) {
        tg.ready();
        tg.expand();
    }
	
	
	
	
	
        // Inicjalizacja Telegram Web App
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand(); // Rozwija okienko na maksymalną wysokość
        }

        const errEl = document.getElementById("err");
        const btn = document.getElementById("btn");

        function fail(msg) {
            errEl.textContent = msg;
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred("error");
            }
        }

        btn.addEventListener("click", () => {
            errEl.textContent = "";
            
            if (!navigator.geolocation) {
                return fail("Twoje urządzenie nie obsługuje geolokalizacji.");
            }

            btn.disabled = true;
            btn.textContent = "Pobieranie danych z satelity...";

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const payload = JSON.stringify({ type: "set_location", lat, lon });
                    
                    if (tg) {
                        if (tg.HapticFeedback) {
                            tg.HapticFeedback.notificationOccurred("success");
                        }
                        tg.sendData(payload);
                        // Zamykamy okienko po wysłaniu danych
                        setTimeout(() => tg.close(), 100); 
                    } else {
                        btn.textContent = `Wysłano: ${lat.toFixed(4)}, ${lon.toFixed(4)}`;
                    }
                },
                (e) => {
                    btn.disabled = false;
                    btn.textContent = "Udostępnij lokalizację";
                    fail("Odmowa dostępu do GPS lub brak sygnału.");
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        });
    </script>
</body>
</html>
