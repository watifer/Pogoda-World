<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel sterowania Pogoda World</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-top: rgb(70, 86, 138);
            --bg-bot: rgb(41, 57, 104);
            --card-bg: rgba(255, 255, 255, 0.12);
            --card-border: rgba(255, 255, 255, 0.18);
            
            --text-main: rgb(230, 235, 245);
            --text-muted: rgba(230, 235, 245, 0.7);
            
            --title-today: rgb(254, 240, 138);   /* Żółty */
            --title-future: rgb(138, 226, 160);  /* Zielony */
            --accent-purple: rgb(220, 180, 255); /* Lawendowy */
            --alert-red: rgb(252, 129, 129);     /* Czerwony alert */
            
            --input-bg: rgba(0, 0, 0, 0.25);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 30px 22px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
            text-align: center;
            margin-top: 10px;
        }

        h3 {
            margin: 0 0 16px 0;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        button {
            width: 100%;
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:active {
            transform: scale(0.98);
        }

        #gps-button {
            background-color: #22c55e;
            color: #000000;
            border: 1px solid rgba(255, 255, 255, 0.25);
            margin-bottom: 5px;
        }

        #gps-button:hover {
            background-color: #22c55e;
            border-color: var(--accent-purple);
        }

    </style>
</head>
<body>
    <div class="container">
        <!-- SEKCJA 1: LOKALIZACJA -->
        <h3 id="ui-title">Panel sterowania</h3>
        <button id="gps-button">📍 <span id="gps-text">Aktualizuj przez GPS</span></button>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        let currentLang = (urlParams.get('lang') || 'en').toLowerCase();
        if (currentLang === "nb") currentLang = "no"; 

        const translations = {
            "pl": { 
                title: "Panel sterowania", 
                btnGps: "Aktualizuj przez GPS",
            },
            "en": { 
                title: "Control Panel", 
                btnGps: "Update via GPS", 
            },
            "de": { 
                title: "Bedienfeld", 
                btnGps: "Mit GPS aktualisieren", 
            },
            "fr": { 
                title: "Panneau de configuration", 
                btnGps: "Mettre à jour via GPS", 
            },
            "es": { 
                title: "Panel de control", 
                btnGps: "Actualizar vía GPS", 
            },
            "no": { 
                title: "Kontrollpanel", 
                btnGps: "Oppdater via GPS", 
            }
        };

        const t = translations[currentLang] || translations["en"];
        
        document.getElementById("ui-title").innerText = t.title;
        document.getElementById("gps-text").innerText = t.btnGps;
        document.getElementById("gps-button").addEventListener("click", () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const payload = JSON.stringify({
                            type: "set_location",
                            lat: position.coords.latitude,
                            lon: position.coords.longitude
                        });
                        tg.sendData(payload);
                    },
                    (error) => { alert("Błąd GPS / GPS Error: " + error.message); }
                );
            } else {
                alert("Geolokalizacja nie jest wspierana. / Geolocation not supported.");
            }
        });

    </script>
</body>
</html>
